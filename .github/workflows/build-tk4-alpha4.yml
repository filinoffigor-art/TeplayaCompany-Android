name: Build TeplayaCompany TK4 Alpha4 Native APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tk4a4/**'
      - '.github/workflows/build-tk4-alpha4.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Static verification
        run: |
          test -f tk4a4/android/app/src/main/java/ru/teplayakompaniya/tk4/MainActivity.java
          grep -Fq "Оборот" tk4a4/android/app/src/main/java/ru/teplayakompaniya/tk4/MainActivity.java
          grep -Fq "Дебиторка" tk4a4/android/app/src/main/java/ru/teplayakompaniya/tk4/MainActivity.java
          grep -Fq "4.0.0-alpha4" tk4a4/android/app/build.gradle
      - name: Build APK
        working-directory: tk4a4/android
        run: gradle :app:assembleDebug --stacktrace
      - name: Validate APK
        run: |
          test -f tk4a4/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l tk4a4/android/app/build/outputs/apk/debug/app-debug.apk | grep -q AndroidManifest.xml
          cp tk4a4/android/app/build/outputs/apk/debug/app-debug.apk TeplayaCompany-v4.0.0-alpha4.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeplayaCompany-v4.0.0-alpha4
          path: TeplayaCompany-v4.0.0-alpha4.apk
          if-no-files-found: error
