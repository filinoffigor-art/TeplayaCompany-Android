name: Build TeplayaCompany v2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'TeplayaCompany-source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unpack Android project
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q TeplayaCompany-source.zip -d build-src

      - name: Verify v2 Engineer module
        run: |
          grep -q "versionName '2.0.0'" build-src/teplaya_company_android_v1/app/build.gradle
          grep -q 'data-screen="engineer"' build-src/teplaya_company_android_v1/app/src/main/assets/index.html
          grep -q '>Инженер<' build-src/teplaya_company_android_v1/app/src/main/assets/index.html
          echo "Verified: Android v2.0.0 + Engineer UI"

      - name: Build APK
        working-directory: build-src/teplaya_company_android_v1
        run: gradle assembleDebug

      - name: Prepare APK
        run: |
          cp build-src/teplaya_company_android_v1/app/build/outputs/apk/debug/app-debug.apk TeplayaCompany-v2.0.0-ENGINEER.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeplayaCompany-v2.0.0-ENGINEER
          path: TeplayaCompany-v2.0.0-ENGINEER.apk
