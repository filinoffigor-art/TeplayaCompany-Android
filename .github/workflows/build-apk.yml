name: Build TeplayaCompany v3.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'TeplayaCompany-source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unpack Android project
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q TeplayaCompany-source.zip -d build-src
      - name: Verify v3.1 dashboard and modules
        run: |
          grep -q "versionName '3.1.0'" build-src/teplaya_company_android_v1/app/build.gradle
          grep -q 'Быстрый доступ' build-src/teplaya_company_android_v1/app/src/main/assets/index.html
          grep -q 'Требует внимания' build-src/teplaya_company_android_v1/app/src/main/assets/index.html
          grep -q 'attention-scroll' build-src/teplaya_company_android_v1/app/src/main/assets/index.html
          grep -q 'Участники бригад' build-src/teplaya_company_android_v1/google-apps-script/Code.gs
          echo "Verified: v3.1 dashboard + engineer + crew + directories + payroll"
      - name: Build APK
        working-directory: build-src/teplaya_company_android_v1
        run: gradle assembleDebug
      - name: Prepare APK
        run: cp build-src/teplaya_company_android_v1/app/build/outputs/apk/debug/app-debug.apk TeplayaCompany-v3.1.0.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeplayaCompany-v3.1.0
          path: TeplayaCompany-v3.1.0.apk
