name: Build TeplayaCompany TK4 Alpha APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - tk4-alpha
    paths:
      - 'tk4/**'
      - '.github/workflows/build-tk4-alpha.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify TK4 source
        run: |
          grep -q "versionName '4.0.0-alpha1'" tk4/android/app/build.gradle
          grep -q 'Оборот' tk4/android/app/src/main/assets/app.js
          grep -q 'Финансы' tk4/android/app/src/main/assets/app.js
          grep -q 'План поступлений' tk4/android/app/src/main/assets/app.js
          grep -q 'Дебиторка' tk4/android/app/src/main/assets/app.js
          echo "Verified TK4 alpha1 source"

      - name: Build APK
        working-directory: tk4/android
        run: gradle assembleDebug

      - name: Prepare APK
        run: cp tk4/android/app/build/outputs/apk/debug/app-debug.apk TeplayaCompany-v4.0.0-alpha1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeplayaCompany-v4.0.0-alpha1
          path: TeplayaCompany-v4.0.0-alpha1.apk
