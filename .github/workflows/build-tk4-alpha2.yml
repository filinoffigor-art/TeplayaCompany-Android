name: Build TeplayaCompany TK4 Alpha2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tk4a2/**'
      - '.github/workflows/build-tk4-alpha2.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify alpha2
        run: |
          grep -q "versionName '4.0.0-alpha2'" tk4a2/android/app/build.gradle
          grep -q 'WebViewAssetLoader' tk4a2/android/app/src/main/java/ru/teplayakompaniya/tk4/MainActivity.java
          grep -q 'android:icon="@mipmap/ic_launcher"' tk4a2/android/app/src/main/AndroidManifest.xml
          echo "Verified TK4 alpha2 fixes"
      - name: Build APK
        working-directory: tk4a2/android
        run: gradle assembleDebug
      - name: Prepare APK
        run: cp tk4a2/android/app/build/outputs/apk/debug/app-debug.apk TeplayaCompany-v4.0.0-alpha2.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeplayaCompany-v4.0.0-alpha2
          path: TeplayaCompany-v4.0.0-alpha2.apk
